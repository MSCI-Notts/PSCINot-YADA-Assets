<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PSCI YADA Public Assets</title>

  <style>
    body{
      font-family:Arial,Helvetica,sans-serif;
      max-width:900px;
      margin:40px auto;
      padding:20px;
      line-height:1.6;
      color:#333;
    }

    h1{
      color:#5A2D82;
    }

    .asset{
      border:1px solid #ddd;
      border-radius:10px;
      padding:15px;
      margin:20px 0;
    }

    img{
      max-width:180px;
      display:block;
      margin-bottom:10px;
    }

    code{
      background:#f4f4f4;
      padding:2px 5px;
    }

    a{
      color:#d97706;
      text-decoration:none;
      font-weight:bold;
    }

    a:hover{
      text-decoration:underline;
    }
  </style>
</head>

<body>

</p>
